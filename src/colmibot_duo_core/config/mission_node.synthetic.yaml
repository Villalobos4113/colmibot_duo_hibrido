# Parámetros de ejemplo para mission_node. Estaciones simbólicas SINTÉTICAS.
# db_dir no se fija aquí a propósito: debe apuntar fuera del código fuente
# (por ejemplo: --ros-args -p db_dir:=$HOME/.local/share/colmibot_duo_demo).
